<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graduation Letter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: radial-gradient(circle at top, #1e293b, #020617);
        font-family: "Poppins", sans-serif;
        position: relative;
      }

      .bg-light {
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(250, 204, 21, 0.08);
        border-radius: 50%;
        filter: blur(90px);
        animation: pulse 6s infinite alternate;
      }

      @keyframes pulse {
        from {
          transform: scale(1);
          opacity: 0.5;
        }
        to {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      .container {
        position: relative;
        width: 360px;
        height: 380px;
        perspective: 1200px;
        cursor: pointer;
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .envelope {
        position: absolute;
        width: 100%;
        height: 220px;
        bottom: 0;
        background: linear-gradient(145deg, #f8fafc, #dbe4ee);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .envelope::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #e2e8f0, #cbd5e1);
        clip-path: polygon(0 0, 50% 58%, 100% 0);
        transform-origin: top;
        transition: 1.2s ease;
        z-index: 5;
      }

      .envelope::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #cbd5e1, #94a3b8);
        clip-path: polygon(0 100%, 50% 45%, 100% 100%);
        z-index: 3;
      }

      .seal {
        position: absolute;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: linear-gradient(145deg, #f59e0b, #d97706);
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 1.2rem;
        z-index: 6;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        transition: 0.8s ease;
      }

      .letter {
        position: absolute;
        width: 92%;
        min-height: 260px;
        left: 4%;
        bottom: 0;
        background: white;
        border-radius: 12px;
        padding: 65px 22px 35px;
        text-align: center;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        transform: translateY(120px);
        opacity: 0;
        transition: 1.8s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 2;
      }

      .container.open .letter {
        transform: translateY(-90px);
        opacity: 1;
      }

      .container.open .envelope::before {
        transform: rotateX(180deg);
      }

      .container.open .seal {
        opacity: 0;
        transform: translate(-50%, -80%) scale(0.5);
      }

      .letter h1 {
        font-family: "Great Vibes", cursive;
        font-size: 2.2rem;
        color: #f59e0b;
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(20px);
        position: relative;
        z-index: 10;
        line-height: 1.2;
        margin-top: 0px;
        word-break: break-word;
      }

      .container.open .letter h1 {
        animation: fadeUp 1s forwards;
        animation-delay: 0.7s;
      }

      .letter p {
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.8;
        opacity: 0;
        transform: translateY(20px);
      }

      .container.open .letter p {
        animation: fadeUp 1s forwards;
        animation-delay: 1.1s;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .click-text {
        position: absolute;
        width: 100%;
        bottom: -60px;
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        letter-spacing: 1px;
        animation: blinkText 2s infinite;
      }

      @keyframes blinkText {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .particles span {
        position: absolute;
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: sparkle 5s linear infinite;
      }

      .particles span:nth-child(1) {
        top: 10%;
        left: 20%;
      }

      .particles span:nth-child(2) {
        top: 20%;
        left: 80%;
        animation-delay: 1s;
      }

      .particles span:nth-child(3) {
        top: 70%;
        left: 15%;
        animation-delay: 2s;
      }

      .particles span:nth-child(4) {
        top: 80%;
        left: 75%;
        animation-delay: 3s;
      }

      @keyframes sparkle {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        50% {
          transform: scale(1.8);
          opacity: 1;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      .flower {
        position: absolute;
        right: -80px;
        bottom: -70px;
        font-size: 4.5rem;
        animation: flowerFloat 5s ease-in-out infinite;
      }

      @keyframes flowerFloat {
        0%,
        100% {
          transform: translateY(0px) rotate(-8deg);
        }
        50% {
          transform: translateY(-12px) rotate(-3deg);
        }
      }

      @media (max-width: 480px) {
        .container {
          width: 310px;
        }

        .letter h1 {
          font-size: 2.5rem;
        }

        .flower {
          font-size: 4rem;
          right: -50px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-light"></div>

    <div class="particles">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="container" onclick="openLetter()">
      <div class="envelope"></div>

      <div class="seal">❤</div>

      <div class="letter">
        <h1>Happy Graduation Dhifahh 🎓</h1>

        <p>
          Semoga langkah berikutnya dipenuhi kebahagiaan, kesuksesan, dan mimpi
          yang tercapai ✨
        </p>
      </div>

      <div class="flower">💐</div>

      <div class="click-text">klik amplopnya 💌</div>
    </div>

    <script>
      function openLetter() {
        document.querySelector(".container").classList.toggle("open");
      }
    </script>
  </body>
</html>
